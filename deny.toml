# cargo-deny configuration for chat-xdk.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check licenses

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
]

[licenses.private]
ignore = false
