[package]
name = "chat-xdk-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for chat-xdk encryption SDK"

[lib]
name = "chat_xdk"
crate-type = ["cdylib"]

[dependencies]
# Core library (with Juicebox support for native builds)
chat-xdk-core = { workspace = true, features = ["juicebox"] }

# Python bindings
pyo3.workspace = true

# Async runtime (for Juicebox calls)
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# Secure memory handling
zeroize.workspace = true
