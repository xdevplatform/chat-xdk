[package]
name = "chat-xdk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI of the chat-xdk encryption SDK, shared by the Go, .NET and JVM bindings"

[lib]
name = "chat_xdk_ffi"
# staticlib → the archive the Go package links (go/chatxdk/libs/)
# cdylib    → the shared library .NET (P/Invoke) and the JVM (JNA) load
crate-type = ["staticlib", "cdylib"]

[features]
default = ["juicebox"]
juicebox = ["chat-xdk-core/juicebox", "dep:tokio"]

[dependencies]
chat-xdk-core = { workspace = true, default-features = false, features = ["bindings"] }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
zeroize.workspace = true

[build-dependencies]
# The C header (go/chatxdk/include/chat_xdk.h) and the C# P/Invoke layer
# (crates/dotnet/dotnet/ChatXdk/NativeMethods.g.cs) are generated from this
# crate's source on every build.
cbindgen = "0.27"
csbindgen = "1"
