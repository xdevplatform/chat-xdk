language = "C"
include_guard = "CHAT_XDK_H"
header = "/* Auto-generated by cbindgen. Do not edit. */"
# cbindgen emits no string constants, so the feature-switch URL is written
# here; a test in src/tests.rs checks it against the core's.
after_includes = '''

/**
 * The X API's feature-switch endpoint, `GET /2/chat/features`. Request the
 * URL `chat_xdk_feature_switches_url` returns, which adds the chat's sender's
 * bucket, without credentials.
 */
#define CHAT_XDK_FEATURES_ENDPOINT "https://api.x.com/2/chat/features"'''
style = "both"
cpp_compat = true

[defines]
# The Juicebox functions exist only in a library built with the juicebox
# feature (the default): define CHAT_XDK_JUICEBOX before including this
# header to declare them.
"feature = juicebox" = "CHAT_XDK_JUICEBOX"

[export]
include = [
    "FfiResult",
]
# Internal entry points for the bindings' feature switches; they declare
# them themselves. Not part of the C API.
exclude = [
    "chat_xdk_internal_feature_start",
    "chat_xdk_internal_feature_complete",
    "chat_xdk_internal_feature_configure",
    "chat_xdk_internal_feature_set_default_endpoint",
]

[export.rename]

[parse]
parse_deps = false
