name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: chat-xdk

    steps:
      - name: Checkout chat-xdk
        uses: actions/checkout@v4
        with:
          path: chat-xdk

      # Needed for the workspace path dependency `../juicebox-sdk` (see Cargo.toml).
      - name: Checkout juicebox-sdk (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: juicebox-systems/juicebox-sdk
          ref: "0.3.4"
          path: juicebox-sdk
          submodules: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            chat-xdk -> target

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust target (wasm32)
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      # `make wasm` also stages the wasm-pack output into crates/wasm/js/pkg/,
      # the layout the npm package ships.
      - name: Build wasm pkg (wasm-pack)
        run: make wasm

      - name: Format (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # crates/core/fuzz is its own workspace, so the workspace build never
      # typechecks it. Compile the targets only; fuzz.yml runs them.
      # The shared target dir keeps this an incremental check.
      - name: Check fuzz targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path crates/core/fuzz/Cargo.toml --bins --target-dir target

      # License policy for third-party crates (see deny.toml + THIRD_PARTY_NOTICES.md).
      # Only on ubuntu to avoid doubling the install; graph is platform-agnostic enough.
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: License check (cargo deny)
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny check licenses

      - name: Test (Rust workspace)
        run: cargo test --workspace

      - name: The bindings feature only compiles in this repository
        run: ./scripts/check_bindings_gate.sh

      - name: Build Python extension (pyo3)
        env:
          PYO3_PYTHON: python
        run: cargo build -p chat-xdk-python

      - name: Install built extension into in-repo Python package
        shell: bash
        run: |
          set -euo pipefail
          EXT_SUFFIX="$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
          # cargo outputs libchat_xdk.{so|dylib} for the cdylib; name it how Python expects.
          if [[ -f target/debug/libchat_xdk.dylib ]]; then
            cp -f target/debug/libchat_xdk.dylib "crates/pyo3/python/chat_xdk/_native${EXT_SUFFIX}"
          elif [[ -f target/debug/libchat_xdk.so ]]; then
            cp -f target/debug/libchat_xdk.so "crates/pyo3/python/chat_xdk/_native${EXT_SUFFIX}"
          else
            echo "Expected target/debug/libchat_xdk.{dylib|so} not found"
            ls -la target/debug || true
            exit 1
          fi

      - name: Test (Python SDK)
        env:
          PYTHONPATH: crates/pyo3/python
        run: |
          # The suites skip when the extension can't be imported (fine for
          # local runs without a build); in CI an import failure must fail
          # the job, not silently skip every Python test.
          python -c "import chat_xdk"
          python -m unittest discover -s crates/pyo3/python/tests -v

      # The suites stub the Juicebox network client, but the wrapper's
      # loader-singleton tests drive the real juicebox-sdk package and skip
      # when it is absent — install it so they run in CI.
      - name: Install juicebox-sdk (optional peer dependency)
        run: npm install --no-save juicebox-sdk
        working-directory: chat-xdk/crates/wasm/js

      - name: Test (Node/wasm SDK)
        run: |
          node crates/wasm/js/tests/sdk_vectors.test.mjs
          node crates/wasm/js/tests/api.test.mjs
          node crates/wasm/js/tests/wrapper.test.mjs
          node crates/wasm/js/tests/features.test.mjs

      # The package declares engines.node >=18; rerun the suites on the floor
      # version, where `require()` of an ES module is unavailable and only the
      # wrapper's dynamic-import loading works.
      - name: Node 18 (engines floor)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Test (Node 18/wasm SDK)
        run: |
          node crates/wasm/js/tests/sdk_vectors.test.mjs
          node crates/wasm/js/tests/api.test.mjs
          node crates/wasm/js/tests/wrapper.test.mjs
          node crates/wasm/js/tests/features.test.mjs

      # go binding suite: the `go` job below. Prebuilt archive byte-verify:
      # .github/workflows/go-prebuilt-linux.yml (PR verify + push sync).

      - name: Build chat_xdk_ffi (JNA / JVM)
        if: runner.os == 'Linux'
        run: cargo build -p chat-xdk-ffi --release

      - name: Setup Java (JVM bindings)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: chat-xdk/crates/jvm/java/chatxdk/pom.xml

      - name: Test (JVM / JNA bindings)
        if: runner.os == 'Linux'
        working-directory: chat-xdk/crates/jvm/java/chatxdk
        run: mvn test -Djna.library.path="${GITHUB_WORKSPACE}/chat-xdk/target/release"

      - name: Setup .NET (.NET bindings)
        if: runner.os == 'Linux'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test (.NET / P/Invoke bindings)
        if: runner.os == 'Linux'
        working-directory: chat-xdk/crates/dotnet/dotnet/ChatXdk.Tests
        run: dotnet test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/chat-xdk/target/release

  compat-v05:
    # Hard gate for 0.6.0: the released 0.5.x packages read the v0 sends this
    # tree makes with every feature switch off. The other direction (this tree
    # reads 0.5.x sends, byte for byte on the wire) runs in `cargo test`
    # against tests/fixtures/compat_v0_5_*.json.
    name: compat with released chatxdk ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["0.5.0", "0.5.2"]

    defaults:
      run:
        working-directory: chat-xdk

    steps:
      - name: Checkout chat-xdk
        uses: actions/checkout@v4
        with:
          path: chat-xdk

      # Needed for the workspace path dependency `../juicebox-sdk` (see Cargo.toml).
      - name: Checkout juicebox-sdk (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: juicebox-systems/juicebox-sdk
          ref: "0.3.4"
          path: juicebox-sdk
          submodules: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            chat-xdk -> target

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python extension (pyo3)
        env:
          PYO3_PYTHON: python
        run: |
          set -euo pipefail
          cargo build -p chat-xdk-python
          EXT_SUFFIX="$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
          cp -f target/debug/libchat_xdk.so "crates/pyo3/python/chat_xdk/_native${EXT_SUFFIX}"

      - name: Write this tree's v0 sends
        env:
          PYTHONPATH: crates/pyo3/python
        run: python tests/compat_v05/write_v0_sends.py "$RUNNER_TEMP/v0_sends.json"

      - name: Install released chatxdk ${{ matrix.version }}
        run: |
          python -m venv "$RUNNER_TEMP/v05"
          "$RUNNER_TEMP/v05/bin/pip" install "chatxdk==${{ matrix.version }}"

      - name: Released chatxdk ${{ matrix.version }} reads them
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/v05/bin/python" "$GITHUB_WORKSPACE/chat-xdk/tests/compat_v05/verify_with_v05.py" "$RUNNER_TEMP/v0_sends.json"

  doc-snippets:
    # Compiles the 0.6.0 half of every snippet in the migration guides against
    # this tree, with each binding's compiler, and runs the C guide's params
    # documents through the library (scripts/check_doc_snippets.py), so a
    # guide that drifts from the API fails CI.
    name: migration guide snippets
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chat-xdk

    steps:
      - name: Checkout chat-xdk
        uses: actions/checkout@v4
        with:
          path: chat-xdk

      # Needed for the workspace path dependency `../juicebox-sdk` (see Cargo.toml).
      - name: Checkout juicebox-sdk (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: juicebox-systems/juicebox-sdk
          ref: "0.3.4"
          path: juicebox-sdk
          submodules: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            chat-xdk -> target

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chat-xdk/go/chatxdk/go.mod
          cache: false

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: chat-xdk/crates/jvm/java/chatxdk/pom.xml

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Rust guide (cargo check)
        run: python scripts/check_doc_snippets.py rust docs/migrating-0.6/rust.md

      - name: Python guide (run against the extension)
        env:
          PYO3_PYTHON: python
        run: |
          set -euo pipefail
          cargo build -p chat-xdk-python
          EXT_SUFFIX="$(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
          cp -f target/debug/libchat_xdk.so "crates/pyo3/python/chat_xdk/_native${EXT_SUFFIX}"
          python scripts/check_doc_snippets.py python docs/migrating-0.6/python.md

      - name: JavaScript guide (tsc)
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/tsc" typescript@5
          TSC="$RUNNER_TEMP/tsc/node_modules/.bin/tsc" python scripts/check_doc_snippets.py ts docs/migrating-0.6/javascript.md

      - name: Go guide (go vet)
        run: python scripts/check_doc_snippets.py go docs/migrating-0.6/go.md

      - name: JVM guide (javac)
        run: |
          set -euo pipefail
          (cd crates/jvm/java/chatxdk && mvn -q -DskipTests compile dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/jvm-classpath.txt")
          JAVA_CLASSPATH="$(cat "$RUNNER_TEMP/jvm-classpath.txt")" python scripts/check_doc_snippets.py java docs/migrating-0.6/jvm.md

      - name: .NET guide (dotnet build)
        run: python scripts/check_doc_snippets.py csharp docs/migrating-0.6/dotnet.md

      - name: C ABI guide (gcc, and its params documents through the library)
        run: |
          set -euo pipefail
          cargo build -p chat-xdk-ffi --release
          python scripts/check_doc_snippets.py c docs/migrating-0.6/c-abi.md

  go:
    name: test go binding (ubuntu)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chat-xdk

    steps:
      - name: Checkout chat-xdk
        uses: actions/checkout@v4
        with:
          path: chat-xdk

      # Needed for the workspace path dependency `../juicebox-sdk` (see Cargo.toml).
      - name: Checkout juicebox-sdk (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: juicebox-systems/juicebox-sdk
          ref: "0.3.4"
          path: juicebox-sdk
          submodules: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            chat-xdk -> target

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: chat-xdk/go/chatxdk/go.mod
          cache: false

      # Builds the static archive (`prebuilt`) into go/chatxdk/libs/linux_amd64,
      # then runs the go/chatxdk suite against it.
      - name: Test (Go SDK)
        run: make test-go
